# ─── dark ────────────────────────────────────────────────────────────────────
# Derived from the two files that already define this system's colours:
#
#   ~/.wall/wp_rice_dark.txt      neutrals — background, text, muted greys.
#                                 The same tokens hyprland's borders, dunst,
#                                 fuzzel and mako read, so the terminal's
#                                 chrome matches theirs exactly.
#   quickshell/Theme.qml          accents — accent/accentAlt/success/warning/
#                                 danger. These are the colours the topbar
#                                 paints all day, so the ANSI palette is built
#                                 out of them rather than out of a stock theme.
#
# Anything here that is not in either file is a Tokyo Night value chosen to sit
# with Theme.qml's accents, which are themselves Tokyo Night.
# Switched by scripts/theme-mode.sh (SUPER+SHIFT+T) via the theme.conf symlink.

# ── surfaces ──
# Pure black, same as wp_rice `background` and the notch's `notchFill`. Under
# background_opacity it reads as tinted glass over hyprland's blur, which is
# what the islands do too.
background              #000000
foreground              #CDD6F4

selection_background    #2A3A5E
selection_foreground    #ECEFF7

# Accent-coloured beam, black text behind it so a cursor over a glyph stays
# legible instead of inverting to mud.
cursor                  #7AA2F7
cursor_text_color       #000000
cursor_trail_color      #7AA2F7

url_color               #7DCFFF

# ── window + tab chrome ──
active_border_color     #7AA2F7
inactive_border_color   #414868
bell_border_color       #E0AF68
visual_bell_color       #7AA2F7

active_tab_foreground   #000000
active_tab_background   #7AA2F7
active_tab_font_style   bold
inactive_tab_foreground #7F849C
inactive_tab_background #10101A
inactive_tab_font_style normal
tab_bar_background      #000000
tab_bar_margin_color    #000000

# ── ANSI ──
# 0/8 are lifted well off pure black: on a #000000 background the stock
# near-black "black" is invisible, and plenty of TUIs draw their borders in it.
color0  #414868
color8  #565F89

color1  #F7768E
color9  #FF8FA3

color2  #9ECE6A
color10 #B9E48C

color3  #E0AF68
color11 #F0C489

color4  #7AA2F7
color12 #9AB8FF

color5  #BB9AF7
color13 #D2B4FF

color6  #7DCFFF
color14 #A4DDFF

color7  #CDD6F4
color15 #EDF0FA

# ── marks ──
# The three highlight slots the toggle_marker maps in kitty.conf use.
mark1_foreground #000000
mark1_background #F7768E
mark2_foreground #000000
mark2_background #E0AF68
mark3_foreground #000000
mark3_background #9ECE6A
