# ─── light ───────────────────────────────────────────────────────────────────
# The dark theme's structure with the two source palettes swapped for their
# light halves: neutrals from ~/.wall/wp_rice_light.txt, accents darkened to
# Tokyo Night Day so they carry the same meaning at readable contrast on a
# light ground (Theme.qml's dark accents are far too pale for #EEF2F7).
# Switched by scripts/theme-mode.sh (SUPER+SHIFT+T) via the theme.conf symlink.

# ── surfaces ──
background              #EEF2F7
foreground              #1E2030

selection_background    #B6C4E0
selection_foreground    #1E2030

cursor                  #2E7DE9
cursor_text_color       #EEF2F7
cursor_trail_color      #2E7DE9

url_color               #007197

# ── window + tab chrome ──
active_border_color     #2E7DE9
inactive_border_color   #8B98A8
bell_border_color       #8C6C3E
visual_bell_color       #2E7DE9

active_tab_foreground   #FFFFFF
active_tab_background   #2E7DE9
active_tab_font_style   bold
inactive_tab_foreground #6E7A89
inactive_tab_background #DCE3ED
inactive_tab_font_style normal
tab_bar_background      #EEF2F7
tab_bar_margin_color    #EEF2F7

# ── ANSI ──
# Inverted weighting from the dark theme: 0/8 are the dark end here, 7/15 the
# light end, so applications that assume "color0 is the background-ish one"
# still land somewhere sane.
color0  #1E2030
color8  #6E7A89

color1  #F52A65
color9  #C64343

color2  #587539
color10 #387068

color3  #8C6C3E
color11 #7A5C2E

color4  #2E7DE9
color12 #2496C4

color5  #9854F1
color13 #7847BD

color6  #007197
color14 #005A78

color7  #4A4E60
color15 #1E2030

# ── marks ──
mark1_foreground #FFFFFF
mark1_background #F52A65
mark2_foreground #FFFFFF
mark2_background #8C6C3E
mark3_foreground #FFFFFF
mark3_background #587539
