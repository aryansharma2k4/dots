# ╭──────────────────────────────────────────────────────────────────────────╮
# │  kitty                                                                   │
# │                                                                          │
# │  Colours live in themes/{dark,light}.conf and are selected by the         │
# │  theme.conf symlink that scripts/theme-mode.sh rewrites (SUPER+SHIFT+T).  │
# │  Nothing in this file contains a literal colour — same rule the           │
# │  quickshell config follows.                                              │
# ╰──────────────────────────────────────────────────────────────────────────╯

# The symlink, not a fixed theme. This is what makes SUPER+SHIFT+T actually
# reach kitty: theme-mode.sh repoints it and then sends kitty SIGUSR1, which
# is a config reload. (Previously this line read `include themes/mocha.conf`,
# so the switch quietly did nothing.)
include theme.conf

# Pick up edits to this file the moment they are saved, no reload needed.
auto_reload_config 0.2


# ── font ─────────────────────────────────────────────────────────────────────
# The exact fontconfig family name. "JetBrains Mono Nerd Font" (with the space)
# is not a real family and only worked because fontconfig guessed; asking for
# the real name skips the guess and guarantees the Nerd glyphs.
font_family      family="JetBrainsMono Nerd Font" style=Regular
bold_font        family="JetBrainsMono Nerd Font" style=Bold
italic_font      family="JetBrainsMono Nerd Font" style=Italic
bold_italic_font family="JetBrainsMono Nerd Font" style="Bold Italic"
font_size        14.0

# JetBrains Mono's programming ligatures (-> => != <=> etc). They are on by
# default; `disable_ligatures cursor` splits the one under the cursor back into
# its component characters so you can see exactly which column you are editing.
# That is the setting that makes ligatures safe to leave on for real work.
disable_ligatures cursor

# ss19 gives the arrow ligatures a straighter, less curly tail; zero already
# has a slash in this face.
font_features JetBrainsMonoNerdFont-Regular +calt +liga +ss19

# Slightly looser lines than the metrics ask for. 14pt at 100% line height is
# dense enough that long log output turns into a wall; +2px is the smallest
# amount that visibly opens it up without wasting rows.
modify_font cell_height 102%
modify_font underline_position 2
modify_font underline_thickness 110%
modify_font strikethrough_position 2

# How glyphs are composited onto the background. `platform` is the default and
# is right for a dark theme with light text; if text ever looks too thin after
# switching to the light theme, `legacy` thickens dark-on-light.
text_composition_strategy platform

# Diagnostics from rustc/tsc/clang all use undercurls. Thick+dense is the one
# that stays visible at 14pt instead of dissolving into a dotted line.
undercurl_style thick-dense

# Nerd Font private-use glyphs (powerline, devicons, the starship prompt) get
# the full cell width instead of being squeezed into a "narrow symbol" box.
narrow_symbols U+E000-U+F8FF 1


# ── cursor ───────────────────────────────────────────────────────────────────
cursor_shape beam
cursor_beam_thickness 1.8

# The trail. `1` is the gap in cells the cursor must jump before a trail is
# drawn — so ordinary left/right typing draws nothing and only real jumps
# (a `dd` in nvim, a fzf selection landing) get the animation.
cursor_trail 1
cursor_trail_start_threshold 2
# fastest/slowest decay in seconds. Tightened from kitty's 0.1 0.4: at the
# default the trail is still visibly catching up after the jump has landed.
cursor_trail_decay 0.06 0.22

cursor_blink_interval 0.5 ease-in-out
# Stop blinking after 8s idle. A blinking cursor in an unattended window is
# a repaint every half second forever, for nothing.
cursor_stop_blinking_after 8.0

# Hide the mouse pointer while typing; it reappears on the next mouse move.
mouse_hide_wait 2.0
pointer_shape_when_dragging beam
pointer_shape_when_grabbed arrow


# ── scrollback ───────────────────────────────────────────────────────────────
# 10k lines is roughly 4-8 MB resident per window and covers any build log you
# would actually read back. Anything larger is what the pager below is for —
# kitty keeps in-memory scrollback per window, so this number is multiplied by
# every split you have open.
scrollback_lines 10000

# `+INPUT_LINE_NUMBER` opens the pager already scrolled to where you were.
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# Disk-backed history handed to the pager, in MB. Costs no RAM — this buffer
# lives in a temp file — so it can be far larger than scrollback_lines.
scrollback_pager_history_size 64

# Wayland gives kitty high-resolution scroll events; pixel_scroll turns them
# into true per-pixel movement and momentum_scroll keeps touchpad flings
# coasting. Together these are what make scrolling feel like a phone rather
# than like a ratchet.
pixel_scroll yes
# Friction for touchpad momentum on Wayland: 0 = none, 1 = never stops.
momentum_scroll 0.96
touch_scroll_multiplier 1.6
wheel_scroll_multiplier 3.0

# Interactive scrollbar down the right edge, matching the theme. Shown once
# you have scrolled back or while the pointer is near the edge, so it costs no
# width at rest.
scrollbar scrolled-and-hovered


# ── performance and memory ───────────────────────────────────────────────────
# repaint_delay 8 ≈ 125 FPS ceiling, but sync_to_monitor caps the real rate at
# the display's refresh, so this costs nothing extra and just removes kitty's
# own 10ms ceiling from the latency budget.
repaint_delay 8
input_delay 2
sync_to_monitor yes

# Hyprland already blurs behind this window (decoration.blur.enabled). Asking
# kitty to blur too would be the same work done twice on the GPU.
background_blur 0

# No IME. Saves the Wayland text-input roundtrip on every keystroke; set to
# `yes` if you ever need to type CJK or use a compose engine.
wayland_enable_ime no

# Only redraw the window that changed rather than every visible one.
visual_bell_duration 0.0
enable_audio_bell no
window_alert_on_bell yes
bell_on_tab "🔔 "


# ── background ───────────────────────────────────────────────────────────────
background_opacity 0.90
dynamic_background_opacity yes

# Make one *extra* colour transparent as well as the background. nvim's
# cursorline / sign column paint their own near-black background, which
# otherwise shows up as an opaque stripe floating on the transparent window.
# Adjust the colour to whatever your nvim theme uses for CursorLine.
transparent_background_colors #10101A@0.94

# Fill the 256-colour slots from the 16 above using the readability-tuned
# algorithm rather than the fixed 1980s table. Matters most in light mode,
# where the legacy 256 palette has genuinely unreadable entries.
palette_generate semantic

# Progress bar along the top edge, driven by OSC 9;4 — pacman, npm, cargo and
# curl all emit it. A build's progress is readable from the window edge even
# when the window is behind something else.
progress_bar top


# ── windows, tabs, layouts ───────────────────────────────────────────────────
# Padding rather than margin: margin is outside the window's own background, so
# with a transparent background it reads as a gap; padding is inside it, which
# is the inset look the islands have.
window_padding_width 10
window_margin_width 0
single_window_padding_width 10

# splits first, so a new kitty starts in the layout you actually use; stack is
# the zoom toggle (kitty_mod+z below).
enabled_layouts splits:split_axis=horizontal,stack,tall:bias=60,fat,grid

window_border_width 1pt
draw_minimal_borders yes
inactive_text_alpha 0.82
hide_window_decorations yes
confirm_os_window_close -1
remember_window_size no
initial_window_width 110c
initial_window_height 32c

tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2
# index, then the directory name, then the running program. The progress
# percent appears automatically for OSC 9;4 emitters.
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{sup.index} {tab.last_focused_progress_percent}{title}"
active_tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{sup.index} {tab.last_focused_progress_percent}{title}"
tab_activity_symbol "● "

# For wide screens: put the tab bar down the left edge instead (kitty 0.48+).
# tab_bar_edge left
# tab_bar_min_tabs 1


# ── shell, urls, integration ─────────────────────────────────────────────────
shell fish
editor nvim

# Full shell integration: prompt marks (jump between commands), cwd reporting
# (new tabs/splits inherit the directory), last-command-output capture, and
# per-mode cursor shape. Everything under "prompts and command output" below
# depends on this.
shell_integration enabled

# Desktop notification when a command that ran unfocused for >20s finishes,
# cleared automatically when you come back to the window.
notify_on_cmd_finish unfocused 20.0 notify focus

allow_hyperlinks yes
underline_hyperlinks hover
show_hyperlink_targets yes
detect_urls yes
url_style curly
open_url_with default

# Treat these as part of a word when double-clicking, so a path or a flag
# selects in one go instead of stopping at every slash.
select_by_word_characters @-./_~?&=%+#:


# ── clipboard ────────────────────────────────────────────────────────────────
# Programs may write to both clipboards freely but must ask before reading —
# reading is the direction that leaks.
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask
copy_on_select clipboard
strip_trailing_spaces smart

# Paste guards: a multiline paste at a prompt is confirmed rather than executed,
# and a bare URL is quoted so a stray `;` in it cannot run.
paste_actions quote-urls-at-prompt,confirm,confirm-if-large


# ── remote control ───────────────────────────────────────────────────────────
# socket-only: `kitten @` works from scripts and from the shell, but a program
# printing an escape sequence cannot drive the terminal. This is what powers
# the send-text / launch / set-colors bindings and lets external scripts
# retheme running windows.
allow_remote_control socket-only
listen_on unix:@kitty-{kitty_pid}

update_check_interval 0
close_on_child_death no


# ╭──────────────────────────────────────────────────────────────────────────╮
# │  keys — kitty_mod is ctrl+shift                                          │
# ╰──────────────────────────────────────────────────────────────────────────╯

# ── discovery ────────────────────────────────────────────────────────────────
# Fuzzy-searchable list of every action kitty can do, with its shortcut.
# When you forget one of the bindings below, this is where to look.
map kitty_mod+f3    command_palette
map kitty_mod+slash command_palette
map kitty_mod+f1    show_kitty_doc overview


# ── copy / paste ─────────────────────────────────────────────────────────────
map ctrl+c       copy_or_interrupt
map kitty_mod+c  copy_to_clipboard
map kitty_mod+v  paste_from_clipboard
map shift+insert paste_from_selection
# Copy with the trailing newline stripped — for pasting a path into a chat.
map kitty_mod+alt+c copy_ansi_to_clipboard


# ── scrolling ────────────────────────────────────────────────────────────────
# Note: plain page_up/page_down are deliberately NOT mapped, so they still
# reach nvim, less, btop and man. kitty_mod+page_up scrolls kitty itself.
map kitty_mod+up        scroll_line_up
map kitty_mod+down      scroll_line_down
map kitty_mod+page_up   scroll_page_up
map kitty_mod+page_down scroll_page_down
map kitty_mod+home      scroll_home
map kitty_mod+end       scroll_end
map kitty_mod+h         show_scrollback


# ── prompts and command output ───────────────────────────────────────────────
# Jump between shell prompts — the fastest way to find where a long build
# actually started.
map ctrl+shift+z scroll_to_prompt -1
map ctrl+shift+x scroll_to_prompt 1
# The output of the last command, in the pager, on its own.
map kitty_mod+g  show_last_command_output
# The same output piped straight into nvim, for grepping and yanking.
map kitty_mod+alt+g launch --stdin-source=@last_cmd_output --stdin-add-formatting --type=overlay nvim -R -
# The whole scrollback in nvim instead of less.
map kitty_mod+alt+h launch --stdin-source=@screen_scrollback --stdin-add-formatting --type=overlay nvim -R -


# ── marks: highlight patterns in place ───────────────────────────────────────
# Toggle a colour over every match in the visible buffer + scrollback. Aimed at
# reading build and test output: errors red, warnings yellow, passes green.
map kitty_mod+m>e toggle_marker itext 1 error
map kitty_mod+m>w toggle_marker itext 2 warn
map kitty_mod+m>p toggle_marker itext 3 pass
# Mark an arbitrary string / regex you type.
map kitty_mod+m>m create_marker
map kitty_mod+m>c remove_marker
# Jump between the marked lines.
map kitty_mod+m>n scroll_to_mark next
map kitty_mod+m>b scroll_to_mark prev


# ── hints: grab things off the screen without the mouse ──────────────────────
# Each of these overlays labels on the matches and you type the label.
map kitty_mod+e     open_url_with_hints
map kitty_mod+p>f   kitten hints --type path --program -
map kitty_mod+p>shift+f kitten hints --type path
# file:line from a compiler error or a stack trace, opened in nvim at that line.
map kitty_mod+p>n   kitten hints --type linenum --linenum-action=tab
map kitty_mod+p>w   kitten hints --type word --program -
map kitty_mod+p>l   kitten hints --type line --program -
# A git SHA, a container id — any hex hash.
map kitty_mod+p>h   kitten hints --type hash --program -
map kitty_mod+p>i   kitten hints --type ip --program -
map kitty_mod+p>y   kitten hints --type hyperlink
# Everything on screen, pick anything.
map kitty_mod+p>p   kitten hints --type regex --regex "\\S+" --program -


# ── window splits ────────────────────────────────────────────────────────────
# New splits and tabs open in the current window's directory (shell integration).
map kitty_mod+enter     launch --location=split --cwd=current
map kitty_mod+backslash launch --location=vsplit --cwd=current
map kitty_mod+minus     launch --location=hsplit --cwd=current
map kitty_mod+w         close_window_with_confirmation ignore-shell

map ctrl+alt+h neighboring_window left
map ctrl+alt+l neighboring_window right
map ctrl+alt+k neighboring_window up
map ctrl+alt+j neighboring_window down

map kitty_mod+left  move_window left
map kitty_mod+right move_window right
map kitty_mod+alt+k move_window up
map kitty_mod+alt+j move_window down

# Interactive resize mode: press, then h/j/k/l, then escape.
map kitty_mod+r start_resizing_window
# Zoom the focused split to fill the tab, and back.
map kitty_mod+z toggle_layout stack
map kitty_mod+l next_layout
# Swap two splits by picking the other one visually.
map kitty_mod+f7 focus_visible_window
map kitty_mod+f8 swap_with_window


# ── tabs ─────────────────────────────────────────────────────────────────────
map kitty_mod+t     new_tab_with_cwd
map kitty_mod+q     close_tab
map ctrl+tab        next_tab
map ctrl+shift+tab  previous_tab
map kitty_mod+alt+t set_tab_title
map kitty_mod+.     move_tab_forward
map kitty_mod+,     move_tab_backward
map kitty_mod+1 goto_tab 1
map kitty_mod+2 goto_tab 2
map kitty_mod+3 goto_tab 3
map kitty_mod+4 goto_tab 4
map kitty_mod+5 goto_tab 5
map kitty_mod+6 goto_tab 6
map kitty_mod+7 goto_tab 7
map kitty_mod+8 goto_tab 8
map kitty_mod+9 goto_tab 9
map kitty_mod+n new_os_window_with_cwd


# ── font size ────────────────────────────────────────────────────────────────
map ctrl+plus        change_font_size all +1
map ctrl+equal       change_font_size all +1
map ctrl+kp_add      change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore  change_font_size all -1
map ctrl+kp_subtract change_font_size all -1
map ctrl+0           change_font_size all 0
map ctrl+kp_0        change_font_size all 0
# Interactive font browser: preview every installed mono face and its features.
map kitty_mod+f2 kitten choose-fonts


# ── opacity ──────────────────────────────────────────────────────────────────
map kitty_mod+a>m set_background_opacity +0.05
map kitty_mod+a>l set_background_opacity -0.05
map kitty_mod+a>1 set_background_opacity 1
map kitty_mod+a>d set_background_opacity default


# ── kittens ──────────────────────────────────────────────────────────────────
# Insert a character by name or codepoint — arrows, box drawing, emoji, and
# every Nerd Font glyph.
map kitty_mod+u kitten unicode_input
# Type into every split at once. Useful across ssh sessions.
map kitty_mod+b launch --allow-remote-control kitten broadcast
# Side-by-side diff with syntax highlighting, image support and word-level
# intra-line diffing. `kitten diff a b` from the shell also works.
map kitty_mod+d launch --type=overlay --cwd=current kitten diff
# ripgrep whose results are clickable — click a hit to open it at that line.
map kitty_mod+f launch --type=overlay --cwd=current sh -c 'printf "rg > "; read -r q; kitten hyperlinked-grep "$q" | less -R'
# Copy a file to/from a remote host over the existing connection.
map kitty_mod+alt+u kitten transfer
map kitty_mod+f5 load_config_file
map kitty_mod+f6 debug_config


# ── mouse ────────────────────────────────────────────────────────────────────
# Middle click pastes the primary selection (X11 habit, works on Wayland here).
mouse_map middle release ungrabbed paste_from_selection
# ctrl+click opens a link, a path, or jumps the prompt cursor to the click.
mouse_map ctrl+left press ungrabbed mouse_handle_click selection link prompt
# ctrl+shift+right-click selects the whole output of the command you click on,
# in one go — no dragging across a 400-line stack trace.
mouse_map ctrl+shift+right press ungrabbed mouse_select_command_output


# ── notifications ────────────────────────────────────────────────────────────
# Silence a program that spams; one line per pattern.
# filter_notification title:.*spam.* all
