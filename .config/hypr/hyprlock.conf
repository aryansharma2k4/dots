$font = JetBrains Mono Nerd Font

# palette — matches quickshell/pill (Catppuccin Mocha, see Singletons/Theme.qml)
$background   = rgba(0, 0, 0, 1.0)
$accent       = rgba(137, 180, 250, 1.0) # blue
$text         = rgba(205, 214, 244, 1.0)
$secondary    = rgba(166, 173, 200, 0.9)
$muted        = rgba(127, 132, 156, 0.85)
$danger       = rgba(243, 139, 168, 1.0) # red
$success      = rgba(166, 227, 161, 1.0) # green
$cardFill     = rgba(0, 0, 0, 0.38)
$cardBorder   = rgba(137, 180, 250, 0.25)
$inputFill    = rgba(0, 0, 0, 0.45)

general {
    hide_cursor = false
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = easeOutExpo, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 3, easeOutExpo
    animation = fadeOut, 1, 2, easeOutExpo
    animation = inputFieldDots, 1, 2, easeOutExpo
    animation = inputFieldColors, 1, 2, easeOutExpo
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 7
    noise = 0.015
    contrast = 1.05
    brightness = 0.55
    vibrancy = 0.2
}

# frosted card behind the clock/input cluster
shape {
    monitor =
    size = 460, 400
    position = 0, 70
    halign = center
    valign = center
    rounding = 28
    border_size = 2
    border_color = $cardBorder
    color = $cardFill
}

# greeting
label {
    monitor =
    text =  Hi, $USER
    font_family = $font
    font_size = 16
    color = $secondary
    position = 0, 235
    halign = center
    valign = center
}

# clock
label {
    monitor =
    text = $TIME
    font_family = $font
    font_size = 84
    color = $text
    position = 0, 150
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_family = $font
    font_size = 17
    color = $muted
    position = 0, 88
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 54
    position = 0, -55
    halign = center
    valign = center

    rounding = 27
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1

    outer_color = $accent
    inner_color = $inputFill
    font_color = $text
    check_color = $success
    capslock_color = $danger
    fail_color = $danger

    fail_text = <span foreground="#f38ba8">$FAIL ($ATTEMPTS)</span>
    placeholder_text = <span foreground="#7f849c"><i>Enter password...</i></span>

    font_family = $font
    fade_on_empty = false
    hide_input = false
}

# keyboard layout — bottom left
label {
    monitor =
    text =  $LAYOUT
    font_family = $font
    font_size = 13
    color = $muted
    position = 36, 32
    halign = left
    valign = bottom
}

# battery — bottom right
label {
    monitor =
    text = cmd[update:15000] ~/.config/scripts/battery-status.sh
    font_family = $font
    font_size = 13
    color = $muted
    position = -36, 32
    halign = right
    valign = bottom
}
