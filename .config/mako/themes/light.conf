anchor=top-right
outer-margin=20
margin=10
width=380
height=180
padding=14
border-size=2
border-radius=14
font=SF Pro Display Medium 11
background-color=#EEF2F7F2
text-color=#1E2030
border-color=#89B4FA
progress-color=over #89B4FA
icons=1
max-icon-size=64
icon-location=left
markup=1
format=<b>%s</b>\n%b
text-alignment=left
default-timeout=7000
max-visible=4
history=1
actions=1
on-button-left=invoke-default-action
on-button-middle=dismiss
on-button-right=dismiss

[urgency=low]
background-color=#EEF2F7F2
text-color=#4A4E60
border-color=#8B98A8
default-timeout=4000

[urgency=normal]
background-color=#EEF2F7F2
text-color=#1E2030
border-color=#89B4FA

[urgency=high]
background-color=#EEF2F7F2
text-color=#1E2030
border-color=#F38BA8
default-timeout=0
